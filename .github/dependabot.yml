# Weekly update PRs, minor and patch grouped into one per ecosystem; a new major
# arrives as a PR of its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 can't check .astro files yet, so `astro check` fails on it
      # (withastro/astro#17268). Drop this once @astrojs/check accepts 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [major, minor, patch]
